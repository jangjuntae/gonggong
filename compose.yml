services:
  postgres:
    image: postgres:17-alpine
    container_name: policy-finance-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-policy_finance}
      POSTGRES_USER: ${DB_USERNAME:-policy_finance}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - policy-finance-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  policy-finance-postgres-data:

